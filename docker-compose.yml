services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: folio-server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      PORT: 5000
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_USE_MOCK: "false"
        VITE_API_URL: "http://localhost:5000/api"
    container_name: folio-client
    ports:
      - "5173:80"
    depends_on:
      - server
    restart: unless-stopped
